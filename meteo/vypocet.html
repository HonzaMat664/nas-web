		<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>JSON</title>
<link rel="stylesheet" href="/css/style.css?">

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
    background: #000;
    color: #00ff66;
    font-family: monospace;
    padding: 20px;
}

h1 {
    color: #00ff66;
}

section {
    margin-bottom: 30px;
}

pre {
    background: #111;
    padding: 15px;
    border: 0px solid #00ff66;
    border-radius: 10px;
    color: #00ffff;
    overflow-x: auto;
}

.warn {
    color: #ff5555;
}
</style>
</head>

<body>
<div id="menu"></div>

<section>
<h2>⏱ Dynamic.json</h2>
<div id="info"></div>
<pre id="dynamic">Načítám...</pre>


<h2>📦 Static.json</h2>
<pre id="static">Načítám...</pre>


<script>
function parseTimeSafe(t) {
    if (!t || typeof t !== "string") return null;
    const d = new Date(t);
    if (isNaN(d.getTime())) return null;
    return d;
}

async function loadDynamic() {
    const info = document.getElementById("info");
    const out = document.getElementById("dynamic");

    try {
        const res = await fetch("/data/dynamic_24h.json");

        if (!res.ok) throw new Error("HTTP chyba: " + res.status);

        const json = await res.json();

        const now = new Date();

        let closest = null;
        let minDiff = Infinity;

        for (const m of json.measurements) {
            const t = parseTimeSafe(m.timestamp);
            if (!t) continue;

            const diff = Math.abs(now - t);

            if (diff < minDiff) {
                minDiff = diff;
                closest = m;
            }
        }

        info.innerHTML =
            "🕒 aktuální čas: " + now.toISOString() +
            "<br>🎯 použitý timestamp: " + closest.timestamp;

        out.innerText = JSON.stringify(closest, null, 2);

    } catch (e) {
        info.innerHTML = `<span class="warn">❌ chyba dynamic</span>`;
        out.innerText = String(e);
    }
}

async function loadStatic() {
    const out = document.getElementById("static");

    try {
        const res = await fetch("/data/vypocet.json");

        if (!res.ok) throw new Error("HTTP chyba: " + res.status);

        const json = await res.json();

        out.innerText = JSON.stringify(json, null, 2);

    } catch (e) {
        out.innerText = "❌ chyba static:\n" + e;
    }
}

loadDynamic();
loadStatic();

setInterval(loadDynamic, 60000);
</script>
<script src="../js/menu.js"></script>

</body>
</html>
