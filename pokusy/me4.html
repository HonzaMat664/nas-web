<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
  <head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta charset="utf-8">
    <title>čidla</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
canvas {
    background-color: #222;
    display: block;
    margin-top: 20px;
    border-radius: 8px;
}
pre {
    font-family: monospace;
    color: #eee;
    margin: 4px 0;
}
#moonData, #sunData {
    margin-top: 10px;
}
</style>
  </head>
  <body>
    <p>čidla tail -f</p>
    <pre id="time">Načítám čas…</pre>
    <pre id="out1">Načítám azimut.csv…</pre>
    <pre id="out3">Načítám vychod.csv…</pre>
    <canvas id="rose" width="300" height="300"></canvas>
    <pre id="moonData">Měsíc…</pre>
    <pre id="sunData">Slunce…</pre>
    <script>
function pad(n) {
    return n.toString().padStart(2,"0");
}

function formatTime(d) {
    return d.getFullYear() + "-" +
           pad(d.getMonth()+1) + "-" +
           pad(d.getDate()) + " " +
           pad(d.getHours()) + ":" +
           pad(d.getMinutes()) + ":" +
           pad(d.getSeconds());
}

function updateTime() {
    document.getElementById("time").innerText = formatTime(new Date());
}

async function loadLastLine(file, elementId) {
    const url = file + "?t=" + Date.now();
    try {
        const r = await fetch(url, {cache: "no-store"});
        if(!r.ok) throw new Error("HTTP " + r.status);
        const text = await r.text();
        const lines = text.trim().split("\n");
        document.getElementById(elementId).innerText = lines[lines.length-1];
        return lines[lines.length-1];
    } catch(err) {
        document.getElementById(elementId).innerText = "Chyba: " + err;
        return null;
    }
}

function polar(alt, az, cx, cy, radius) {
    if(alt < 0) return null;
    if(alt > 90) alt = 90;
    const r = radius * (1 - alt/90);
    const theta = (az + 90) * Math.PI/180;
    const x = cx + r * Math.cos(theta);
    const y = cy + r * Math.sin(theta);
    return [x, y];
}

function drawRose(sunAlt, sunAz, moonAlt, moonAz) {
    const canvas = document.getElementById("rose");
    const ctx = canvas.getContext("2d");
    const w = canvas.width;
    const h = canvas.height;
    const cx = w/2;
    const cy = h/2;
    const radius = Math.min(cx, cy) - 10;

    ctx.clearRect(0,0,w,h);

    // obzor
    ctx.strokeStyle = "#666";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI*2);
    ctx.stroke();

    // hlavní kříž
    ctx.strokeStyle = "#333";
    ctx.beginPath();
    ctx.moveTo(cx, cy-radius);
    ctx.lineTo(cx, cy+radius);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx-radius, cy);
    ctx.lineTo(cx+radius, cy);
    ctx.stroke();

    // druhý kříž - otočený 23°
    ctx.strokeStyle = "#555";
    const angleRad = -23 * Math.PI/180;
    const cos = Math.cos(angleRad);
    const sin = Math.sin(angleRad);
    ctx.beginPath();
    ctx.moveTo(cx - radius*sin, cy - radius*cos);
    ctx.lineTo(cx + radius*sin, cy + radius*cos);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx - radius*cos, cy + radius*sin);
    ctx.lineTo(cx + radius*cos, cy - radius*sin);
    ctx.stroke();

    // jih nahoře
    ctx.fillStyle = "#aaa";
    ctx.font = "14px monospace";
    ctx.textAlign = "center";
    ctx.fillText("J", cx, cy-radius-8);

    // Slunce
    if(!isNaN(sunAlt) && !isNaN(sunAz)) {
        const pos = polar(sunAlt, sunAz, cx, cy, radius);
        if(pos){
            ctx.fillStyle = "yellow";
            ctx.beginPath();
            ctx.arc(pos[0], pos[1], 6, 0, Math.PI*2);
            ctx.fill();
        }
    }

    // Měsíc
    if(!isNaN(moonAlt) && !isNaN(moonAz)) {
        const pos = polar(moonAlt, moonAz, cx, cy, radius);
        if(pos){
            ctx.fillStyle = "lightblue";
            ctx.beginPath();
            ctx.arc(pos[0], pos[1], 6, 0, Math.PI*2);
            ctx.fill();
        }
    }
}

async function tick() {
    updateTime();

    // CSV vychod.csv pro Měsíc
    const lineVychod = await loadLastLine("data/vychod.csv", "out3");

    // CSV azimut.csv pro Slunce a graf
    const lineAzimut = await loadLastLine("data/azimut.csv", "out1");

    if(lineVychod){
        const parts = lineVychod.split(",");
        if(parts.length >= 10){
            document.getElementById("moonData").innerText =
`Měsíc
Azimut: ${parts[6]}
Výška: ${parts[5]}
Východ: ${parts[3]}
Západ: ${parts[4]}
Stáří Měsíce: ${parts[8]}
Úplněk: ${parts[9]}`;
        }
    }

    if(lineAzimut){
        const parts = lineAzimut.split(",");
        if(parts.length >= 5){
            const sunAlt  = parseFloat(parts[1]);
            const sunAz   = parseFloat(parts[3]); // opraveno podle tvého požadavku
            drawRose(sunAlt, sunAz, parseFloat(parts[3]), parseFloat(parts[4]));

            document.getElementById("sunData").innerText =
`Slunce
Azimut: ${parts[3]}
Výška: ${parts[2]}
Východ: (z vychod.csv)
Západ: (z vychod.csv)`;
        }
    }
}

// spuštění a interval
tick();
setInterval(tick, 1000);

</script>
  </body>
</html>
