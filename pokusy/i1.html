    <style>
    /* Reset a základní styl */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: monospace;
      background-color: #111;
      color: #00cc66; /* zelený text */
      line-height: 1.5;
    }

    header {
      background: #222;
      padding: 15px;
      text-align: center;
    }
    header h1 {
      font-size: 1.5em;
      color: #eee;
    }

    /* Navigace */
    nav {
      display: flex;

      gap: 10px;

      justify-content: center;

    nav a {

      transition: 0.2s;

    nav a:hover {

    main {

    }

    #out {

      border-radius: 6px;
      margin-bottom: 20px;

    .section {

    <script>
fetch("data/data.csv")
  .then(response => {
    if (!response.ok) throw new Error("HTTP " + response.status);
    return response.text();
  })
  .then(text => {
    const lines = text.trim().split("\n");
    document.getElementById("out").innerText = lines[lines.length - 1];
  })
  .catch(err => {
    document.getElementById("out").innerText = "Chyba: " + err;
  });
</script>
