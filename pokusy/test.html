<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
  <head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta charset="UTF-8">
    <title>Test Slunce/Měsíc</title>
    <style>
body {
font-family: monospace;
background: #111;
color: #0f0;
    }
  </style>
  </head>
  <body>
    <h3>Měsíc</h3>
    <pre>Azimut : <span id="mesic_azimut">--</span></pre>
    <pre>Výška  : <span id="mesic_vyska">--</span></pre>
    <pre>Východ : <span id="mesic_vychod">--</span></pre>
    <pre>Západ  : <span id="mesic_zapad">--</span></pre>
    <h3>Slunce</h3>
    <pre>Azimut : <span id="slunce_azimut">--</span></pre>
    <pre>Výška  : <span id="slunce_vyska">--</span></pre>
    <pre>Východ : <span id="slunce_vychod">--</span></pre>
    <pre>Západ  : <span id="slunce_zapad">--</span></pre>
    <script>

// simulace pole vychod (jako z CSV)
const vychod = [
    "2026-03-03 10:00:00",  // 0
    "",                     // 1
    "",                     // 2
    "2026-03-03 06:12:00",  // 3 - měsíc východ
    "2026-03-03 18:45:00",  // 4 - měsíc západ
    "35°",                  // 5 - výška
    "120°",                 // 6 - azimut
    "",                     // 7
    "5 dní"                 // 8 - stáří
];

// Měsíc
document.getElementById("mesic_azimut").innerText = vychod[6];
document.getElementById("mesic_vyska").innerText = vychod[5];
document.getElementById("mesic_vychod").innerText = vychod[3].split(" ")[1];
document.getElementById("mesic_zapad").innerText = vychod[4].split(" ")[1];

// Slunce (jen testovací hodnoty)
document.getElementById("slunce_azimut").innerText = "210°";
document.getElementById("slunce_vyska").innerText = "25°";
document.getElementById("slunce_vychod").innerText = "06:45";
document.getElementById("slunce_zapad").innerText = "17:58";

</script>
  </body>
</html>
